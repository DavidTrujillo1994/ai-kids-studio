aikids:
  root: ${AIKIDS_ROOT:.}
  python: ${AIKIDS_PYTHON:.venv/Scripts/python.exe}
  frontend: ${AIKIDS_FRONTEND:${aikids.root}/frontend/angular-app/dist/angular-app/browser}

server:
  address: 127.0.0.1        # nunca expuesta a la red
  port: ${AIKIDS_PORT:8095}

spring:
  application:
    name: ai-kids-studio
  datasource:
    url: jdbc:sqlite:${aikids.root}/data/aikids.db?journal_mode=WAL&foreign_keys=on&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1   # SQLite admite un solo escritor
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.community.dialect.SQLiteDialect
  main:
    banner-mode: off

logging:
  file:
    name: ${aikids.root}/data/logs/aikids.log
